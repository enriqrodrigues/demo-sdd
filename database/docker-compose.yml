# Execute em database/: docker compose --env-file ../.env up -d
services:
  postgres:
    image: postgres:18.6
    container_name: demo-sdd-postgres
    environment:
      POSTGRES_DB: usuarios
      POSTGRES_USER: ${DB_USERNAME:?defina DB_USERNAME no .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql

volumes:
  dados-postgres:
