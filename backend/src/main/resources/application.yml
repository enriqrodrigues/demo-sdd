spring:
  application:
    name: usuarios
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

app:
  frontend-url: ${APP_FRONTEND_URL}
  ativacao:
    validade: PT24H
  sessao:
    inatividade: PT30M
  fuso: America/Sao_Paulo
